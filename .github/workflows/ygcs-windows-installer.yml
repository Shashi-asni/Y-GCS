name: Y-GCS Windows Installer

# One-click Windows build for the Y-GCS fork. Run it from the Actions tab
# (workflow_dispatch); the NSIS installer is uploaded as a workflow artifact.
#
# Produces: Y-GCS-installer-AMD64.exe (unsigned).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Native package versions come from git describe and need tags.
          fetch-depth: 0

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      # Uses the repository's own builder setup (Python, CMake, Ninja, and the
      # Qt 6.12.0 SDK the project pins in .github/build-config.json). aqt does
      # not yet publish 6.12.0, so the project installer is required.
      - name: Build setup (Python, CMake, Ninja, Qt)
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          mode: desktop
          qt-host: windows
          qt-arch: win64_msvc2022_64
          build-type: Release

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset Windows `
            -DQGC_CPACK_GENERATOR=NSIS `
            -DQGC_ENABLE_GST_VIDEOSTREAMING=OFF `
            -DQGC_USE_CACHE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build --preset Windows --parallel

      - name: Build NSIS installer
        shell: pwsh
        run: cmake --build --preset Windows --target qgc-package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Y-GCS-Windows-Installer
          path: build/Windows/*.exe
          if-no-files-found: error
